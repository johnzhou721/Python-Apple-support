name: Catalyst

on:
  push:
    branches:
      - 3.11
      - 3.12
      - 3.13

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Set up Python environment
      uses: actions/setup-python@v5.0.0
      with:
        python-version: "3.X"
    
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build Catalyst
      run: |
        cd macios
        make
